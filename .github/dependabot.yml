version: 2
updates:
  # Actions are pinned to commit hashes. Dependabot opens a pull request that
  # moves the hash and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/sherloc"
    schedule:
      interval: "weekly"
    ignore:
      # pandas 3 needs Python 3.11 or newer; Sherloc supports Python 3.10.
      # Remove this when Sherloc moves to Python 3.11.
      - dependency-name: "pandas"
        versions: [">=3"]
