# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Sync with IOC stalkerware indicators

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  # weekly on Sunday at 00:00
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.10
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r sherloc/requirements.txt
    # checkout a submodule
    - name: Checkout AssoEchap/stalkerware-indicators
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: AssoEchap/stalkerware-indicators
        path: './sherloc/stalkerware-indicators'
    - name: Update
      run: |
        python sherloc/scripts/get-stalkerware-indicators.py
    # Pull requests from forks and PR-triggered runs cannot open PRs, so this
    # only validates the update script there.
    - name: Create Pull Request
      id: cpr
      if: github.event_name != 'pull_request'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
      with:
        add-paths: |
          sherloc/static_data/app-flags.csv
          sherloc/static_data/app-flags-source.json

        token: ${{ secrets.IOC_UPDATE_KEY || secrets.MY_TOKEN || github.token }}
        commit-message: Update stalkerware indicators
        committer: GitHub <noreply@github.com>
        author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        signoff: false
        branch: ioc
        delete-branch: false
        title: 'Update stalkerware indicators'
        body: |
          Adds apps from AssoEchap/stalkerware-indicators to the app list and records the
          source commit and date in `sherloc/static_data/app-flags-source.json`, which Sherloc shows.
          Review the added rows before merging.
          - Auto-generated by [create-pull-request][1]

          [1]: https://github.com/peter-evans/create-pull-request
        labels: |
          report
          automated pr
        draft: false
    - name: Check outputs
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: |
        echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
        echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
