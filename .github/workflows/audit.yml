name: Dependency audit

on:
  pull_request:
    paths:
      - "sherloc/requirements.txt"
      - ".github/workflows/audit.yml"
  push:
    branches: [ "main" ]
    paths:
      - "sherloc/requirements.txt"
      - ".github/workflows/audit.yml"
  schedule:
    # New advisories appear without any change here, so check every week.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the pinned requirements
        # PYSEC-2026-2860 (CVE-2025-26240): pdfkit 1.0.0 from_string lets page
        # script run and read local files. No fixed release exists. We escape
        # all user text, disable JavaScript and do not enable local file
        # access (tests/test_printout.py). Remove this line once pdfkit has a fix.
        run: >
          pip-audit -r sherloc/requirements.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-2860
