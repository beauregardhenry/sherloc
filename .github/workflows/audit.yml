name: Dependency audit

on:
  pull_request:
    paths:
      - "sherloc/requirements.txt"
      - ".github/workflows/audit.yml"
  push:
    branches: [ "main" ]
    paths:
      - "sherloc/requirements.txt"
      - ".github/workflows/audit.yml"
  schedule:
    # New advisories appear without any change here, so check every week.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: Audit the pinned requirements
        run: pip-audit -r sherloc/requirements.txt --progress-spinner off
